services:
  eastyundesk:
    build: .
    image: eastyundesk:latest
    ports:
      - "3001:3001"
    volumes:
      # Persist all EastYunDesk state: generated config, auth DB, permissions,
      # sessions/projects, memory, skills/plugins, and router stats.
      - eastyundesk-home:/root/.eastyundesk
      # Optional: mount an existing config file instead of generating one from env vars.
      # Create the host file first, then uncomment this line.
      # - ${EASTYUNDESK_CONFIG:-${HOME}/.eastyundesk/eastyundesk.yaml}:/root/.eastyundesk/eastyundesk.yaml:ro
      # Optional: expose a host workspace to agents running inside the container.
      # - ${EASTYUNDESK_WORKSPACE:-${PWD}}:/workspace
    environment:
      - NODE_ENV=production
      - EASTYUN_HOME=/root/.eastyundesk
      - SERVER_PORT=3001
      - EASTYUNDESK_GATEWAY_PORT=18789
      # Require login for REST and WebSocket access, including the terminal.
      - EASTYUNDESK_DISABLE_LOCAL_AUTH=0
      #
      # ── Proxy (uncomment if behind corporate proxy) ──
      # - https_proxy=http://host.docker.internal:7890
      # - EASTYUNDESK_PROXY=http://host.docker.internal:7890
      #
      # ── Or configure via env vars instead of mounting yaml ──
      # - EASTYUNDESK_MODEL=openai/gpt-4.1
      # - EASTYUNDESK_API_KEY=sk-xxx
      # - EASTYUNDESK_API_URL=https://api.openai.com/v1
    restart: unless-stopped

volumes:
  eastyundesk-home:
